name: Release CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: Force release (bypass conventional commits)
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      release_type:
        description: Release type (when force release is true)
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# The release commits a version bump back to main, so two runs must never overlap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release Tokglint
    runs-on: windows-latest
    env:
      HUSKY: 0
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Anchor the current version when no release tag exists
        shell: pwsh
        run: |
          $existing = git tag --list --merged HEAD "v*.*.*"
          if ($existing) { exit 0 }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $count = [int](git rev-list --count HEAD)
          $target = if ($count -gt 1) { git rev-parse "HEAD~1" } else { git rev-parse HEAD }
          git tag "v$version" $target
          git push origin "v$version"

      - name: Force release commit
        if: github.event.inputs.force_release == 'true'
        shell: pwsh
        run: |
          git commit --allow-empty -m "🔧 chore(release): force ${{ github.event.inputs.release_type }} release"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
