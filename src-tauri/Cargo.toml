[package]
name = "tokglint"
version = "0.2.0"
description = "Tokglint — tray, taskbar widget, and React settings"
authors = ["you"]
edition = "2021"
repository = "https://github.com/canisminor1990/tokglint"

[lib]
name = "tokglint"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Tokglint"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[features]
default = ["custom-protocol"]
# Production / plain `cargo build`: load UI from embedded frontendDist.
# `tauri dev` disables this so the Vite server is used instead.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "json"] }
semver = "1"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
]

[dev-dependencies]
tempfile = "3"

# Soft release: full LTO + opt-level=3 crashes rustc (AV) when linking the
# embedded monitor crate. Still strips the console via windows_subsystem.
[profile.release]
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = true
